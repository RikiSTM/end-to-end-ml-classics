[tool.poetry]
name = "applied-ml-classic"
version = "0.1.0"
description = "Telco Customer Churn Prediction - Career Break Project"
authors = ["Riki S <rikisutiaman@gmail.com>"] 
package-mode = false                      

[tool.poetry.dependencies]
python = ">=3.12,<3.14"                         
omegaconf = "^2.3.0"
pandas = "^2.2"
numpy = "^2.4.2"
scikit-learn = "^1.8.0"
xgboost = "^3.2.0"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"
mlflow = "^3.10.1"
fastapi = "^0.135.3"
uvicorn = "^0.44.0"
evidently = "^0.7.21"
great-expectations = "^1.17.2"
shap = "^0.52.0"
fairlearn = "^0.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)"
]
